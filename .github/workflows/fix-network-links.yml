name: Fix CasaStudent network links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy cross-country URLs
        shell: bash
        run: |
          find . -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#https://studentbnb\.it/#https://casastudent.it/#g' \
            -e 's#https://studentbnb\.es/#https://casastudent.es/#g' \
            -e 's#https://studentbnb\.fr/#https://casastudent.fr/#g' \
            -e 's#https://student-bnb\.de/#https://casastudent.de/#g' \
            -e 's#https://studentbnb\.pl/#https://casastudent.pl/#g'
      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No legacy network links found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix CasaStudent cross-country links'
          git push
